<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c5ed0" />
    <title>연결 확인 | MINDOT</title>
    <style>
      :root {
        color: #142033;
        font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        font-size: 16px;
        line-height: 1.6;
        background: #f2f6fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding:
          calc(20px + env(safe-area-inset-top, 0px))
          calc(20px + env(safe-area-inset-right, 0px))
          calc(20px + env(safe-area-inset-bottom, 0px))
          calc(20px + env(safe-area-inset-left, 0px));
        background: #f2f6fb;
      }

      main {
        width: min(100%, 440px);
        border: 1px solid #c8d4e3;
        border-radius: 14px;
        padding: 40px;
        background: #ffffff;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.1em;
      }

      .brand-mark {
        position: relative;
        display: block;
        width: 27px;
        height: 23px;
        color: #3c8cff;
      }

      .brand-mark span {
        position: absolute;
        display: block;
        border-radius: 50%;
        background: currentColor;
      }

      .brand-mark span:nth-child(1) {
        top: 1px;
        left: 1px;
        width: 7px;
        height: 7px;
      }

      .brand-mark span:nth-child(2) {
        top: 7px;
        right: 1px;
        width: 6px;
        height: 6px;
        opacity: 0.75;
      }

      .brand-mark span:nth-child(3) {
        bottom: 0;
        left: 9px;
        width: 10px;
        height: 10px;
      }

      .brand-mark::before,
      .brand-mark::after {
        position: absolute;
        left: 6px;
        height: 1px;
        background: currentColor;
        content: '';
        opacity: 0.5;
        transform-origin: left center;
      }

      .brand-mark::before {
        top: 6px;
        left: 7px;
        width: 14px;
        transform: rotate(20deg);
      }

      .brand-mark::after {
        top: 9px;
        width: 12px;
        transform: rotate(53deg);
      }

      h1 {
        margin: 36px 0 0;
        font-size: 2rem;
        line-height: 1.3;
      }

      p {
        margin: 12px 0 0;
        color: #435168;
        font-size: 14px;
        line-height: 1.7;
        word-break: keep-all;
      }

      form {
        margin-top: 28px;
      }

      button {
        width: 100%;
        min-height: 48px;
        border: 1px solid #1c5ed0;
        border-radius: 8px;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        background: #1c5ed0;
        cursor: pointer;
      }

      button:hover {
        border-color: #154ba8;
        background: #154ba8;
      }

      button:focus-visible {
        outline: 3px solid #a9c1e4;
        outline-offset: 2px;
      }

      @media (max-width: 480px) {
        body {
          align-items: flex-start;
          padding-right: 14px;
          padding-left: 14px;
        }

        main {
          border-radius: 12px;
          padding: 28px 20px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="offline-title">
      <div class="brand" aria-label="MINDOT">
        <span class="brand-mark" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span>MINDOT</span>
      </div>

      <h1 id="offline-title">인터넷 연결을 확인해 주세요.</h1>
      <p>
        현재 네트워크에 연결할 수 없습니다.
        연결 상태를 확인한 뒤 다시 시도해 주세요.
      </p>

      <form action="/" method="get">
        <button type="submit">다시 시도하기</button>
      </form>
    </main>
  </body>
</html>
