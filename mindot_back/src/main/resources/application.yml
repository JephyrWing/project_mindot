spring:
  application:
    name: mindot_back

  datasource:
    url: jdbc:postgresql://localhost:5432/mindot_db
    username: ${DB_USER:postgres}
    password: ${DB_PW:postgres}

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        model: text-embedding-3-small

  autoconfigure:
    exclude:
      # 스프링 시큐리티 기본 로그인 비활성화
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration