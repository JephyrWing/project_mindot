services:
  mindot-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mindot_db
    ports: 
      - "5432:5432"
    volumes: 
      - mindot_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    env_file:
      - .env.local
    environment:
      REDIS_PW: ${REDIS_PW}
    ports:
      - "6379:6379"
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PW" --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PW\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - data

networks:
  app:
  data:

volumes:
  mindot_pgdata:
  redis_data: