name: Build and deploy Mindot

on:
  push:
    branches: ["main"]
    paths:
      - "mindot_back/**"
      - "mindot_front/**"
      - "mindot_ai/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: mindot-production
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: mindot_back
            image: mindot-back
          - context: mindot_front
            image: mindot-front
          - context: mindot_ai
            image: mindot-fastapi
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              set -e
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mindot-back:latest
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mindot-front:latest
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mindot-fastapi:latest
              cd ~/app || { mkdir -p ~/app; cd ~/app; }
              sudo docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --remove-orphans
              sudo docker image prune -f
