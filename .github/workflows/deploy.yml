name: Build and deploy Mindot

on:
  push:
    branches: ["main"]
    paths:
      - "mindot_back/**"
      - "mindot_front/**"
      - "mindot_ai/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mindot_back/**"
      - "mindot_front/**"
      - "mindot_ai/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-e2e:
    name: Frontend Playwright requirements
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindot_front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mindot_front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report-${{ github.run_attempt }}
          path: mindot_front/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  backend-tests:
    name: Backend JUnit requirements
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mindot_back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Existing test bases start isolated PostgreSQL/pgvector and Redis containers.
      - name: Check Docker for Testcontainers
        run: docker info

      # Test report Back sheet: BE-FUNC-001 through BE-FUNC-032.
      # AiConsentGateIntegrationTest is declared in AiConcentGateTntegrationTest.java.
      - name: Run documented backend tests
        run: >-
          bash ./gradlew test --no-daemon --console=plain
          --tests com.my.mindot_back.common.security.SecurityApiIntegrationTest
          --tests com.my.mindot_back.users.controller.SignupApiIntegrationTest
          --tests com.my.mindot_back.users.controller.LoginApiIntegrationTest
          --tests com.my.mindot_back.redis.service.RefreshSessionIntegrationTest
          --tests com.my.mindot_back.common.security.SessionBoundaryApiTest
          --tests com.my.mindot_back.users.controller.SocialAuthFlowTest
          --tests com.my.mindot_back.users.controller.UserProfileApiTest
          --tests com.my.mindot_back.users.controller.ConsentApiIntegrationTest
          --tests com.my.mindot_back.users.controller.AiConsentGateIntegrationTest
          --tests com.my.mindot_back.records.service.EmotionQuickFlowTest
          --tests com.my.mindot_back.records.controller.EmotionRecordQueryApiTest
          --tests com.my.mindot_back.records.controller.EmotionRecordConfirmFlowTest
          --tests com.my.mindot_back.records.service.EmotionRecordDeleteFlowTest
          --tests com.my.mindot_back.records.service.EmotionRecordReanalysisFlowTest
          --tests com.my.mindot_back.records.service.SemanticSearchApiTest
          --tests com.my.mindot_back.records.service.PatternExplanationFlowTest
          --tests com.my.mindot_back.records.controller.ReflectionOpenFlowTest
          --tests com.my.mindot_back.records.controller.ReflectionQueryApiTest
          --tests com.my.mindot_back.records.service.ReflectionTurnFlowTest
          --tests com.my.mindot_back.records.service.ReflectionRetryFlowTest
          --tests com.my.mindot_back.records.controller.ReflectionConfirmFlowTest
          --tests com.my.mindot_back.records.controller.ReflectionTerminalFlowTest
          --tests com.my.mindot_back.safety.SafetyFlowIntegrationTest
          --tests com.my.mindot_back.admin.AdminApiIntegrationTest
          --tests com.my.mindot_back.reports.WeeklyReportIntegrationTest
          --tests com.my.mindot_back.reports.MonthlyReportIntegrationTest
          --tests com.my.mindot_back.reports.PdfExportApiTest
          --tests com.my.mindot_back.reports.RecentPatternIntegrationTest
          --tests com.my.mindot_back.notifications.NotificationGenerationIntegrationTest
          --tests com.my.mindot_back.notifications.NotificationInboxApiTest
          --tests com.my.mindot_back.centers.CenterSearchApiTest
          --tests com.my.mindot_back.stt.controller.SpeechToTextApiTest

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_attempt }}
          path: |
            mindot_back/build/reports/tests/test/
            mindot_back/build/test-results/test/
          if-no-files-found: ignore
          retention-days: 14

  fastapi-tests:
    name: FastAPI pytest requirements
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mindot_ai/tests
    env:
      PYTHON_DOTENV_DISABLED: '1'
      OPENAI_API_KEY: offline-fixture
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            mindot_ai/requirements.txt
            mindot_ai/tests/requirements-test.txt

      - name: Install FastAPI test dependencies
        run: python -m pip install -r ../requirements.txt -r requirements-test.txt

      # The existing fixtures block external requests during tests.
      - name: Prepare tokenizer cache for offline tests
        run: python -c "import tiktoken; tiktoken.get_encoding('o200k_base')"

      # Run from tests/ so pytest.ini selects exactly the eight documented files.
      - name: Run documented FastAPI tests
        run: >-
          python -m pytest -c pytest.ini -v
          --html=../artifacts/fastapi-tests/report.html --self-contained-html
          --junitxml=../artifacts/fastapi-tests/junit.xml

      - name: Upload FastAPI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-test-reports-${{ github.run_attempt }}
          path: mindot_ai/artifacts/fastapi-tests/
          if-no-files-found: ignore
          retention-days: 14

  build-and-push:
    if: github.event_name == 'push'
    needs: [frontend-e2e, backend-tests, fastapi-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: mindot_back
            image: mindot-back
          - context: mindot_front
            image: mindot-front
          - context: mindot_ai
            image: mindot-fastapi
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              set -e
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mindot-back:latest
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mindot-front:latest
              sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mindot-fastapi:latest
              cd ~/app || { mkdir -p ~/app; cd ~/app; }
              sudo docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --remove-orphans
              sudo docker image prune -f
